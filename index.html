<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Wiserr — כניסה</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@300;400;500&family=Jost:wght@300;400;500&display=swap" rel="stylesheet">
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
body {
  background: #0f0e0c;
  color: #faf8f4;
  font-family: 'Jost', sans-serif;
  font-weight: 300;
  min-height: 100vh;
  display: flex;
  align-items: center;
  justify-content: center;
}
.card {
  width: 100%;
  max-width: 400px;
  padding: 48px 40px;
  border: 1px solid rgba(184,151,42,0.2);
  background: #13120f;
}
.logo {
  font-family: 'Cormorant Garamond', serif;
  font-size: 32px;
  font-weight: 500;
  color: #d4af37;
  letter-spacing: 0.08em;
  text-align: center;
  margin-bottom: 6px;
}
.tagline {
  font-size: 11px;
  letter-spacing: 0.2em;
  text-transform: uppercase;
  color: #6b6760;
  text-align: center;
  margin-bottom: 40px;
}
label {
  display: block;
  font-size: 11px;
  letter-spacing: 0.15em;
  text-transform: uppercase;
  color: #6b6760;
  margin-bottom: 8px;
}
input {
  width: 100%;
  padding: 12px 14px;
  background: rgba(255,255,255,0.04);
  border: 1px solid rgba(184,151,42,0.2);
  color: #faf8f4;
  font-family: 'Jost', sans-serif;
  font-size: 15px;
  font-weight: 300;
  outline: none;
  transition: border-color 0.2s;
  text-align: right;
  direction: ltr;
}
input:focus { border-color: rgba(184,151,42,0.5); }
input::placeholder { color: #3a3832; }
.btn {
  width: 100%;
  margin-top: 20px;
  padding: 13px;
  background: rgba(184,151,42,0.12);
  border: 1px solid rgba(184,151,42,0.3);
  color: #d4af37;
  font-family: 'Jost', sans-serif;
  font-size: 12px;
  letter-spacing: 0.2em;
  text-transform: uppercase;
  cursor: pointer;
  transition: 0.2s;
}
.btn:hover { background: rgba(184,151,42,0.22); border-color: #d4af37; }
.btn:disabled { opacity: 0.5; cursor: not-allowed; }
.err {
  margin-top: 14px;
  font-size: 13px;
  color: #c0392b;
  text-align: center;
  min-height: 20px;
}
</style>
</head>
<body>
<div class="card">
  <div class="logo">Wiserr</div>
  <div class="tagline">Senior Advisor Gig Builder</div>
  <label>קוד גישה</label>
  <input type="text" id="code" placeholder="הקלד את קוד הגישה שלך" autocomplete="off" />
  <button class="btn" id="btn" onclick="login()">כניסה</button>
  <div class="err" id="err"></div>
</div>

<script>
  // Auto-login if code saved
  const saved = sessionStorage.getItem('wiserr_code');
  if (saved) {
    document.getElementById('code').value = saved;
    login();
  }

  document.getElementById('code').addEventListener('keydown', e => {
    if (e.key === 'Enter') login();
  });

  async function login() {
    const code = document.getElementById('code').value.trim();
    if (!code) return;

    const btn = document.getElementById('btn');
    const err = document.getElementById('err');
    btn.disabled = true;
    btn.textContent = 'בודק...';
    err.textContent = '';

    try {
      const res = await fetch('/api/verify', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ code })
      });
      const data = await res.json();

      if (data.ok) {
        sessionStorage.setItem('wiserr_code', code);
        window.location.href = '/app.html';
      } else {
        err.textContent = 'קוד שגוי. נסה שוב.';
        btn.disabled = false;
        btn.textContent = 'כניסה';
      }
    } catch (e) {
      err.textContent = 'שגיאת תקשורת. רענן ונסה שוב.';
      btn.disabled = false;
      btn.textContent = 'כניסה';
    }
  }
</script>
</body>
</html>
